services:
  app:
    # 默认用源码构建；若已有预构建镜像，可改为 image: skpl-api:latest 并删除 build
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skpl-api
    restart: always
    ports:
      - '1337:1337'
    environment:
      DB: postgres
      DATABASE_HOST: db
      DATABASE_PORT: '5432'
      DATABASE_NAME: skpl
      DATABASE_USERNAME: skpl
      DATABASE_PASSWORD: change-me-strong-password
      # 生产密钥 —— 部署前务必全部替换为随机字符串
      APP_KEYS: change-me-key1,change-me-key2
      API_TOKEN_SALT: change-me-salt
      ADMIN_JWT_SECRET: change-me-admin-jwt
      TRANSFER_TOKEN_SALT: change-me-transfer-salt
      ENCRYPTION_KEY: change-me-encryption-key
      JWT_SECRET: change-me-jwt-secret
      # 反向代理对外地址（用 kejilion 的"添加域名访问"时填域名）
      # PUBLIC_URL: https://api.example.com
      # IS_PROXIED: 'true'
    volumes:
      # kejilion 风格：数据统一放 /home/docker/<应用名>/ 下的 bind mount
      - ./uploads:/app/examples/getstarted/public/uploads
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: skpl-db
    restart: always
    environment:
      POSTGRES_DB: skpl
      POSTGRES_USER: skpl
      POSTGRES_PASSWORD: change-me-strong-password
    volumes:
      - ./pgdata:/var/lib/postgresql/data
